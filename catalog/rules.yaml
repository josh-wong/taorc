version: 1
rules:
  # --- P: Principles (chapter 1) ---

  - id: P1
    slug: minimize-time-to-understand
    category: principles
    title: Optimize every coding decision for how fast an unfamiliar reader can follow it
    instruction: >
      Treat "how long would it take an unfamiliar reader to understand this
      and confirm it's correct" as the metric a coding decision should
      optimize. When this catalog's other rules conflict with each other in
      a specific case, the one that most reduces time-to-understand wins.
    rationale: >
      This is the single theme every other rule in this catalog exists to
      serve; a rule that helps in general but hurts time-to-understanding in
      a specific case should lose that case.
    chapter: 1
    severity: warning
    lintable: false

  - id: P2
    slug: smaller-isnt-automatically-more-readable
    category: principles
    title: Fewer lines is usually good, but it is not the same goal as readability
    instruction: >
      Do not chase a lower line count once it starts costing understanding
      time. A dense one-line expression can take longer to verify than a
      plainer version spread across two or three lines, and a line that
      "adds code" (such as a well-placed comment) can still be a net win if
      it makes the surrounding code faster to understand.
    chapter: 1
    severity: suggestion
    lintable: false
    examples:
      - lang: python
        before: "return (cfg := load_config(path)) and cfg.enabled and cfg.timeout or DEFAULT_TIMEOUT"
        after: |
          cfg = load_config(path)
          if cfg is None or not cfg.enabled:
              return DEFAULT_TIMEOUT
          return cfg.timeout

  - id: P3
    slug: readability-rarely-conflicts-with-other-goals
    category: principles
    title: Treat an apparent conflict between readability and other goals as a signal to look harder
    instruction: >
      Efficiency, good architecture, and testability rarely conflict with
      writing code that is easy to understand — pursuing readability
      typically produces a design that is also cleanly factored and simple
      to verify with a test. When a real conflict does appear, spend the
      extra effort to
      imagine how an unfamiliar reader would see the code, and let
      minimizing their understanding time break the tie.
    chapter: 1
    severity: suggestion
    lintable: false

  # --- N: Names (chapter 2: packing information into names) ---

  - id: N1
    slug: specific-over-vague-words
    category: names
    title: Prefer a specific word over a vague one when a precise word exists
    instruction: >
      Replace generic verbs and nouns (get, do, thing, data, handle) with a
      word that tells the reader what actually happens or what is stored,
      whenever a more specific word is available and not misleading.
    chapter: 2
    severity: warning
    lintable: false
    examples:
      - lang: go
        before: "func (c *Cache) Get(key string) (string, error)"
        after: "func (c *Cache) FetchOrLoad(key string) (string, error)"

  - id: N2
    slug: reserve-placeholder-names-for-short-lifetimes
    category: names
    title: Reserve placeholder names like tmp and retval for genuinely short-lived values
    instruction: >
      Use tmp, retval, or a bare loop index only when the variable's entire
      lifetime is a couple of lines and nothing about it matters beyond that
      brief, temporary existence (a swap slot, a running accumulator). In a
      nested loop, prefer index names that echo the collection they index
      (matching first letters) over plain i, j, k, so a mismatched index
      stands out as a bug rather than reading as fine.
    chapter: 2
    severity: suggestion
    lintable: false
    examples:
      - lang: java
        before: |
          for (int i = 0; i < rows.size(); i++)
              for (int j = 0; j < cols.size(); j++)
                  if (grid[i][j] == target)
                      matches.add(rows[j]);   // bug: should be rows[i]
        after: |
          for (int ri = 0; ri < rows.size(); ri++)
              for (int ci = 0; ci < cols.size(); ci++)
                  if (grid[ri][ci] == target)
                      matches.add(rows[ci]);   // mismatch is now obvious

  - id: N3
    slug: encode-units-and-formats-in-names
    category: names
    title: Put units, formats, or encodings in the name when the value could be misread
    instruction: >
      When a value carries a unit (seconds, bytes, degrees) or an encoding
      (UTC, base64, escaped HTML) that a caller could get wrong, put it in
      the identifier rather than leaving it to a type comment the reader may
      not see at the call site.
    chapter: 2
    severity: warning
    lintable: false
    examples:
      - lang: go
        before: "pollInterval := 5"
        after: "pollIntervalMs := 5"

  - id: N4
    slug: flag-unsafe-state-in-name
    category: names
    title: Mark values that are dangerous or need special handling in the name
    instruction: >
      If leaving a value in its default form is risky (an unescaped string,
      a plaintext secret, unvalidated input), prefix or suffix the name so
      the risk travels with every reference to it, instead of living only in
      a comment at the point of creation.
    chapter: 2
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: "path = request.args[\"path\"]"
        after: "unsanitized_path = request.args[\"path\"]"

  - id: N5
    slug: scale-name-length-to-scope
    category: names
    title: Scale name length to the size of the scope the name lives in
    instruction: >
      A name visible across many files earns a longer, descriptive name; a
      value used for a couple of lines can stay short because a reader can
      see its whole life at a glance. Do not give a five-word name to a
      value that dies at the end of the next line, and do not give a single
      letter to a value threaded through half a module or held as a class
      member.
    chapter: 2
    severity: suggestion
    lintable: false

  - id: N6
    slug: avoid-obscure-project-abbreviations
    category: names
    title: Avoid an abbreviation a new teammate would not recognize
    instruction: >
      Before shortening a name, ask whether a new teammate would understand
      it without being told. Widely understood shortenings (eval, doc, str)
      are fine; a project-invented abbreviation usually is not, and typing
      the full name back out costs nothing once editor autocomplete is in
      play.
    chapter: 2
    severity: suggestion
    lintable: false
    examples:
      - lang: java
        before: "class UsrSvc { ... }"
        after: "class UserService { ... }"

  - id: N7
    slug: use-consistent-name-formatting
    category: names
    title: Use the codebase's naming format consistently to convey meaning
    instruction: >
      Follow the project's established conventions for capitalization,
      separators, and related name forms (a trailing underscore for members,
      a distinct case for constants versus macros, a marker prefix for a
      specific kind of object). Consistent formatting gives readers a visual
      shortcut for an identifier's role, the way syntax highlighting does,
      without their needing to open its declaration.
    chapter: 2
    severity: suggestion
    lintable: false

  - id: N8
    slug: remove-unneeded-words-from-names
    category: names
    title: Remove words that add no information, but keep the meaning precise
    instruction: >
      Make names as short as they can be without losing useful information.
      Drop a word that repeats something already implied by the type or
      context, and keep a longer name when the extra word prevents ambiguity
      or describes a wider scope.
    chapter: 2
    severity: suggestion
    lintable: false
    examples:
      - lang: python
        before: "def perform_cleanup(self): ..."
        after: "def cleanup(self): ..."

  - id: N9
    slug: prefer-concrete-over-abstract-names
    category: names
    title: Prefer a concrete name that describes what an entity actually does
    instruction: >
      Replace an abstract name with a concrete one that tells the reader
      what the code specifically checks, builds, or affects. If one name is
      being asked to carry two unrelated purposes, split it into two
      specific names instead of stretching a vague one to cover both.
    chapter: 2
    severity: suggestion
    lintable: false
    examples:
      - lang: go
        before: "func (q *Queue) IsReady() bool { ... }"
        after: "func (q *Queue) HasPendingWrites() bool { ... }"

  # --- N: Names (chapter 3: names that can't be misconstrued) ---

  - id: N10
    slug: booleans-read-as-yes-no-questions
    category: names
    title: Name booleans so they read as a yes-or-no question
    instruction: >
      Prefix boolean variables and boolean-returning functions with is, has,
      can, or should (or an equivalent), so a reader can tell at the call
      site whether true means proceed or stop without opening the
      definition.
    chapter: 3
    severity: warning
    lintable: false
    examples:
      - lang: java
        before: "boolean paginate;"
        after: "boolean shouldPaginate;"

  - id: N11
    slug: avoid-negated-boolean-names
    category: names
    title: Avoid negation in boolean names
    instruction: >
      Name booleans so they read positively (enabled, not disabled). A
      double negative, such as !isNotReady, forces the reader to mentally
      cancel two negatives at every call site.
    chapter: 3
    severity: suggestion
    lintable: false
    examples:
      - lang: csharp
        before: "bool skipCache = false;"
        after: "bool useCache = true;"

  - id: N12
    slug: first-last-vs-begin-end-for-ranges
    category: names
    title: Use first and last for an inclusive range, begin and end for a half-open one
    instruction: >
      When naming a pair of bounds, use first and last for a range that
      includes both ends, and begin/end for a range that excludes the
      endpoint (there is no ordinary word for the position immediately after
      the final element, so begin/end is the idiomatic stand-in). Do not mix
      the two conventions
      for the same kind of range within one codebase.
    chapter: 3
    severity: warning
    lintable: false

  - id: N13
    slug: max-min-prefix-for-hard-limits
    category: names
    title: Prefix a hard limit with max or min rather than a bare noun
    instruction: >
      A variable that caps a quantity (attempts, size, retries) reads
      unambiguously as an inclusive limit when named maxAttempts or minSize;
      a bare attempts or size leaves the reader guessing whether it is the
      limit or the current count.
    chapter: 3
    severity: suggestion
    lintable: false
    examples:
      - lang: python
        before: "UPLOAD_LIMIT = 25"
        after: "MAX_UPLOAD_MB = 25"

  - id: N14
    slug: resolve-ambiguous-overloaded-words
    category: names
    title: Avoid a name whose common meaning could be read two different ways
    instruction: >
      Some ordinary words split cleanly into two plausible readings once
      they're attached to code — a name that could mean either "keep this"
      or "discard this," or either "shrink to this size" or "cut off this
      much." Before using such a word, pick a name that resolves the
      ambiguity outright rather than hoping context will.
    chapter: 3
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: "def clean(records): ...  # discards bad records, or repairs them in place?"
        after: "def discard_invalid(records): ..."

  - id: N15
    slug: match-users-expectations
    category: names
    title: Match users' expectations for conventional method names
    instruction: >
      Respect established conventions when a name carries an expected
      meaning to callers. Do not give an expensive, on-the-fly computation a
      name that convention marks as a cheap, constant-time accessor (a
      get-style name, or a container's size-style method); rename it to
      signal the real cost, or make the implementation live up to the name.
    chapter: 3
    severity: warning
    lintable: false

  - id: N16
    slug: scrutinize-names-for-wrong-interpretations
    category: names
    title: Actively look for ways a name could be misunderstood
    instruction: >
      Before settling on a name, deliberately try to misread it: pretend you
      know nothing of your intent and list every plausible meaning a
      stranger could pin on it. When more than one candidate name is on the
      table, run each one through this test and keep whichever survives it
      best.
    chapter: 3
    severity: warning
    lintable: false

  # --- A: Aesthetics and layout (chapter 4) ---

  - id: A1
    slug: give-similar-code-the-same-shape
    category: aesthetics
    title: Give structurally similar code the same visual shape, then make it compact
    instruction: >
      When several blocks do a structurally similar job (parallel
      constructor calls, a series of field assignments), rearrange line
      breaks so their outline matches from one block to the next, then look
      for a more compact layout that keeps that consistency instead of
      leaving it needlessly spread out.
    chapter: 4
    severity: suggestion
    lintable: false
    examples:
      - lang: python
        before: |
          web = Server("web", 8080,
              True)
          api = Server("api",
              8081, False)
          admin = Server("admin", 8082, True)
        after: |
          web = Server("web", 8080, True)
          api = Server("api", 8081, False)
          admin = Server("admin", 8082, True)

  - id: A2
    slug: use-helpers-to-clean-repeated-irregularity
    category: aesthetics
    title: Use a helper method when repeated detail prevents a consistent layout
    instruction: >
      If rearranging line breaks cannot make repeated code compact and
      regular because the repeated parts differ in visual length, extract
      the repeated setup or assertion into a helper so the important,
      varying values sit next to each other in plain sight.
    chapter: 4
    severity: suggestion
    lintable: false
    examples:
      - lang: java
        before: |
          assertEquals(200, response.getStatusCode());
          assertEquals("application/json", response.getHeader("Content-Type"), "wrong content type: " + response.getBody());
          assertTrue(response.getBody().contains("\"id\""), "response missing id field, got: " + response.getBody());
        after: |
          assertStatus(response, 200);
          assertHeader(response, "Content-Type", "application/json");
          assertBodyContains(response, "\"id\"");

  - id: A3
    slug: align-similar-lines-into-columns
    category: aesthetics
    title: Align repeated similar lines into columns when it improves skimming
    instruction: >
      For a block of near-identical lines (a table of constants, parallel
      assignments), align corresponding parts into columns when that lets a
      reader's eye track straight down instead of re-parsing every line from
      scratch. Drop the alignment if it becomes real upkeep work rather than
      a one-time formatting pass.
    chapter: 4
    severity: suggestion
    lintable: false
    examples:
      - lang: go
        before: |
          name := "retries"
          timeoutSeconds := 30
          maxConnections := 100
        after: |
          name           := "retries"
          timeoutSeconds := 30
          maxConnections := 100

  - id: A4
    slug: order-code-by-meaning
    category: aesthetics
    title: Give unordered items a deliberate order, then repeat it everywhere they appear
    instruction: >
      When several declarations or related items have no order forced by
      correctness, choose one that means something to the reader (matching
      an external order, most-to-least important, or alphabetical) and keep
      that same order everywhere the same items appear together.
    chapter: 4
    severity: suggestion
    lintable: false
    examples:
      - lang: javascript
        before: "function validateAddress(zip, state, city, street) { ... }"
        after: "function validateAddress(street, city, state, zip) { ... }"

  - id: A5
    slug: organize-declarations-into-logical-blocks
    category: aesthetics
    title: Organize declarations into logical blocks
    instruction: >
      Group related declarations and methods together under meaningful
      section labels so readers can digest a class or file as a hierarchy of
      groups, instead of scanning one undifferentiated list.
    chapter: 4
    severity: suggestion
    lintable: false
    examples:
      - lang: python
        before: |
          class Report:
              def __init__(self): ...
              def total_revenue(self): ...
              def _cache_key(self): ...
              def add_line_item(self): ...
              def _validate(self): ...
              def render_pdf(self): ...
        after: |
          class Report:
              # Construction
              def __init__(self): ...

              # Mutators
              def add_line_item(self): ...

              # Queries
              def total_revenue(self): ...

              # Output
              def render_pdf(self): ...

              # Internal helpers
              def _cache_key(self): ...
              def _validate(self): ...

  - id: A6
    slug: break-large-blocks-into-paragraphs
    category: aesthetics
    title: Break large blocks into logical paragraphs
    instruction: >
      Use a blank line to separate a large block into logical steps, the way
      written prose uses paragraph breaks: a visual marker that keeps a
      reader oriented and shows where one idea ends and the next begins,
      not decoration. Pair each paragraph with a short summary comment when
      that helps a reader skim the sequence of steps.
    chapter: 4
    severity: suggestion
    lintable: false
    examples:
      - lang: ruby
        before: |
          def checkout(cart)
            cart.items.each { |i| i.reserve_stock }
            total = cart.items.sum(&:price)
            total += shipping_cost(cart)
            charge = payment_gateway.charge(total)
            order = Order.create(cart: cart, charge: charge)
            cart.items.each { |i| i.confirm_reservation }
            order
          end
        after: |
          def checkout(cart)
            cart.items.each { |i| i.reserve_stock }

            total = cart.items.sum(&:price)
            total += shipping_cost(cart)
            charge = payment_gateway.charge(total)

            order = Order.create(cart: cart, charge: charge)
            cart.items.each { |i| i.confirm_reservation }
            order
          end

  - id: A7
    slug: prefer-consistency-over-personal-style
    category: aesthetics
    title: Prefer consistency over the personally preferred style
    instruction: >
      When multiple formatting styles are equally readable on their own
      (brace placement, for instance), follow the style already used by the
      project even if it is not the one you would have picked yourself. A
      codebase that applies one convention everywhere is easier to read than
      one where each file follows its author's individual taste.
    chapter: 4
    severity: suggestion
    lintable: false
    examples:
      - lang: java
        before: |
          public void start() {
              running = true;
          }

          public void stop()
          {
              running = false;
          }
        after: |
          public void start() {
              running = true;
          }

          public void stop() {
              running = false;
          }

  # --- C: Comments (chapter 5: knowing what to comment) ---

  - id: C1
    slug: dont-restate-the-code
    category: comments
    title: Do not write a comment that only restates what the code already says
    instruction: >
      If a comment is redundant with the identifier and syntax already in
      front of the reader, delete it — including a comment written only to
      satisfy a habit of "every function needs one." A comment earns its
      line by adding something the code does not already express.
    chapter: 5
    severity: warning
    lintable: false
    examples:
      - lang: java
        before: |
          // Getter for the count field
          public int getCount() { return count; }
        after: "public int getCount() { return count; }"

  - id: C2
    slug: fix-bad-names-instead-of-commenting-around-them
    category: comments
    title: Fix a bad name instead of writing a comment to compensate for it
    instruction: >
      When a comment exists mainly to explain what an unclear function or
      variable name means, improve the name instead so the meaning travels
      with every use. A comment should not have to compensate for a name
      that could simply be better.
    chapter: 5
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: |
          # Stops watching the file. This does not delete the file on disk.
          def unwatch(path): ...
        after: "def stop_watching(path): ..."

  - id: C3
    slug: record-information-the-code-cannot-show
    category: comments
    title: Use comments to record insight the code by itself cannot convey
    instruction: >
      Write down the insight a future reader would otherwise have no way to
      recover: why a surprising design won out over the obvious one, or an
      honest note that a section is messy and how it should eventually be
      cleaned up. Judge a comment by whether it helps the reader, not by
      which category of information it falls into — a mechanical rule about
      which category is allowed will exclude comments that would have
      helped.
    chapter: 5
    severity: warning
    lintable: false

  - id: C4
    slug: flag-known-flaws-with-markers
    category: comments
    title: Mark known shortcuts and unfinished work with a searchable marker
    instruction: >
      Use a consistent marker such as TODO, FIXME, HACK, or XXX, plus enough
      context to act on it later, for code that is deliberately incomplete
      or a known compromise, so the gap is discoverable instead of silent.
      Prose that describes the gap without a marker — noting what a real
      implementation would do, or that this version is simplified — is the
      failure this rule names. It reads as commentary rather than as work
      outstanding, and no search will ever surface it.
    chapter: 5
    severity: suggestion
    lintable: false
    examples:
      - lang: python
        before: |
          def parse_timestamp(raw):
              return raw  # TODO
        after: |
          def parse_timestamp(raw):
              # TODO(#482): raw is a Unix epoch today; switch to ISO 8601 once
              # the ingest service migrates, then drop this passthrough.
              return raw

  - id: C5
    slug: explain-constants
    category: comments
    title: Explain a constant's value when the number itself doesn't explain the choice
    instruction: >
      A magic-looking threshold, timeout, or limit needs one line on why
      that value was chosen (a measured budget, an external limit, a safety
      margin) unless the name alone already makes it obvious.
    chapter: 5
    severity: suggestion
    lintable: false
    examples:
      - lang: go
        before: "const maxRetries = 4"
        after: |
          // The upstream gateway rate-limits after 5 requests in 10s; 4 keeps
          // one retry in reserve for a genuine transient failure.
          const maxRetries = 4

  - id: C6
    slug: anticipate-reader-questions
    category: comments
    title: Comment where a careful reader would stop and ask why
    instruction: >
      Before finishing a piece of non-obvious code, reread it as a stranger
      would, and add a comment at the exact line where a reader is likely to
      pause and wonder why it wasn't done the more obvious way.
    chapter: 5
    severity: suggestion
    lintable: false

  - id: C7
    slug: document-surprising-behavior
    category: comments
    title: Advertise a likely pitfall before a caller discovers it the hard way
    instruction: >
      If a function has a slow or blocking side effect, an unusual failure
      mode, or a runtime cost that isn't apparent from its name, document
      that surprising part explicitly at the definition, so a caller who
      trusts the name at face value cannot get burned by it.
    chapter: 5
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: "def resize_image(path, width): ..."
        after: |
          def resize_image(path, width):
              """Downloads the source image from remote storage first if it isn't cached locally."""

  - id: C8
    slug: give-big-picture-context
    category: comments
    title: Give a complex file or class a short comment stating its overall purpose
    instruction: >
      For a piece of code whose role in the system isn't obvious from
      skimming its parts, add a few sentences near the top stating what it
      accomplishes and how it fits with its neighbors, so a new reader can
      orient before reading the detail.
    chapter: 5
    severity: suggestion
    lintable: false

  - id: C9
    slug: summarize-a-block-with-one-comment
    category: comments
    title: Summarize a multi-step block with a single comment instead of narrating each line
    instruction: >
      When a sequence of statements accomplishes one coherent step, put one
      comment above the block describing that step, rather than a comment
      above every line, so a skimming reader can get the gist before
      deciding whether to read the details.
    chapter: 5
    severity: suggestion
    lintable: false

  - id: C10
    slug: write-comments-early-and-refine-them
    category: comments
    title: Write a rough comment early, then make it precise
    instruction: >
      If you hesitate to comment because a good one feels like work, write
      down the rough version of the thought first, exactly as it occurs to
      you, then reread it and replace vague phrases with the specific thing
      you meant. Commenting as you go avoids reconstructing all the useful
      context later.
    chapter: 5
    severity: suggestion
    lintable: false

  # --- C: Comments (chapter 6: making comments precise and compact) ---

  - id: C11
    slug: keep-comments-compact-and-dense
    category: comments
    title: Keep comments compact and information-dense
    instruction: >
      If a comment is worth writing, make every word in it earn its place:
      say in one line what would otherwise take three, without dropping any
      of the information a reader needs.
    chapter: 6
    severity: suggestion
    lintable: false

  - id: C12
    slug: avoid-ambiguous-pronouns
    category: comments
    title: Avoid a pronoun a reader would have to work to resolve
    instruction: >
      Replace this, it, or that in a comment with the specific noun it
      refers to whenever more than one candidate is plausible from
      context. Making the reader trace back through the code to resolve a
      pronoun defeats the comment's purpose.
    chapter: 6
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: "# Copy the file into the archive, but check if it's already compressed."
        after: "# Copy the file into the archive, but check if the file is already compressed."

  - id: C13
    slug: polish-sloppy-comment-sentences
    category: comments
    title: Polish comments into direct, precise sentences
    instruction: >
      Replace a roundabout first draft with a shorter, more direct sentence
      that states exactly what the code does. Making a comment more precise
      and making it more compact are usually the same edit.
    chapter: 6
    severity: suggestion
    lintable: false

  - id: C14
    slug: describe-function-behavior-precisely
    category: comments
    title: Describe a function's behavior precisely, including its corner cases
    instruction: >
      A comment that only restates a function's name in sentence form isn't
      precise enough to answer the corner-case questions a caller will
      actually have. Say exactly what the function returns for the edge
      inputs a reasonable caller would wonder about (empty input, no
      matches, a boundary value).
    chapter: 6
    severity: warning
    lintable: false
    examples:
      - lang: rust
        before: |
          // Returns the number of words in this string.
          fn word_count(s: &str) -> usize { ... }
        after: |
          // Counts whitespace-delimited tokens; runs of whitespace count once,
          // and leading or trailing whitespace is ignored.
          fn word_count(s: &str) -> usize { ... }

  - id: C15
    slug: illustrate-corner-cases-with-input-output-comments
    category: comments
    title: Show a corner case with a worked input and output rather than describing it
    instruction: >
      When a function's behavior is hard to describe compactly in prose,
      include a worked example that demonstrates the important boundary,
      duplicate, or otherwise surprising case and shows the resulting
      output, rather than trying to enumerate every case in words.
    chapter: 6
    severity: suggestion
    lintable: false

  - id: C16
    slug: state-intent-for-tricky-code
    category: comments
    title: State the intent behind the code, not just an account of its mechanics
    instruction: >
      Write the comment as what the code is trying to accomplish, not a
      restatement of the steps it takes to get there. Stating intent has a
      side benefit: if the code's actual behavior contradicts what you meant
      it to do, that mismatch becomes visible as soon as someone compares
      the two, whereas a literal restatement of the steps would agree with
      a bug by construction.
    chapter: 6
    severity: suggestion
    lintable: false

  - id: C17
    slug: use-inline-comments-for-mysterious-arguments
    category: comments
    title: Label a mysterious function argument inline at the call site
    instruction: >
      When a call passes a bare literal whose meaning isn't obvious (a raw
      number or boolean), use a compact inline comment naming the parameter
      it fills, placed before the value rather than after it. Reserve this
      for genuinely mysterious arguments, not every ordinary call.
    chapter: 6
    severity: suggestion
    lintable: false
    examples:
      - lang: cpp
        before: "ScheduleJob(3, true);"
        after: "ScheduleJob(/* priority = */ 3, /* recurring = */ true);"

  - id: C18
    slug: use-information-dense-words
    category: comments
    title: Reach for an established term of art instead of describing it from scratch
    instruction: >
      When a comment is explaining a pattern that already has a common name
      in the field (memoization, debouncing, an idempotent operation), use
      that term instead of spelling out the mechanism in full. Reserve new
      project-specific jargon for cases with no existing term, and define it
      once the first time it's used.
    chapter: 6
    severity: suggestion
    lintable: false

  # --- F: Control flow (chapter 7) ---

  - id: F1
    slug: order-comparison-arguments-by-volatility
    category: control-flow
    title: Put the value being examined on the left of a comparison and the value it is measured against on the right
    instruction: >
      Write a comparison in the order a reader would say it aloud: the
      quantity you are asking about first, the constant or stable value it is
      measured against second. Reversing the two forces the reader to flip
      the expression mentally before they can answer the question it asks.
    chapter: 7
    severity: suggestion
    lintable: false
    examples:
      - lang: typescript
        before: "if (MAX_RETRIES > attempt) { ... }"
        after: "if (attempt < MAX_RETRIES) { ... }"

  - id: F2
    slug: order-if-else-blocks-deliberately
    category: control-flow
    title: Put the positive, the simpler, or the more interesting case first
    instruction: >
      When either branch could be written first, lead with the affirmative
      form of the condition rather than its negation, with the shorter branch
      when one is much shorter, and with the case a reader came to this code
      to find. These preferences occasionally pull against each other; when
      they do, pick the order that reaches the branch the reader cares about
      soonest.
    chapter: 7
    severity: suggestion
    lintable: false
    examples:
      - lang: typescript
        before: |
          if (!user.isActive) {
            showReactivationPrompt();
          } else {
            loadDashboard();
          }
        after: |
          if (user.isActive) {
            loadDashboard();
          } else {
            showReactivationPrompt();
          }

  - id: F3
    slug: limit-ternaries-to-simple-choices
    category: control-flow
    title: Reach for a conditional expression only when it is genuinely quicker to understand than an if/else
    instruction: >
      A ternary earns its place for a simple either/or choice between two
      values. Once it carries nested conditions, side effects, or long
      branches, the lines it saves cost more reading time than they save, and
      a plain if/else states the same logic in a form the reader can scan.
    chapter: 7
    severity: suggestion
    lintable: false
    examples:
      - lang: javascript
        before: 'const label = n === 0 ? "none" : n === 1 ? "one" : n < 10 ? "a few" : "many";'
        after: |
          function describeCount(n) {
            if (n === 0) return "none";
            if (n === 1) return "one";
            if (n < 10) return "a few";
            return "many";
          }

  - id: F4
    slug: avoid-do-while-loops
    category: control-flow
    title: Avoid a loop whose condition is only visible after its body
    instruction: >
      A do/while states what governs the loop below the code it governs, so a
      reader works through the body once without knowing what controls it,
      and a continue inside one jumps to a place many readers guess wrong.
      Restructure as a while or for loop with the condition stated up front,
      even when that costs a duplicated line.
    chapter: 7
    severity: suggestion
    lintable: false
    examples:
      - lang: csharp
        before: |
          int attempt = 0;
          do {
              response = Send(request);
              attempt++;
          } while (response.IsTransientFailure && attempt < MaxAttempts);
        after: |
          Response response = Send(request);
          int attempt = 1;
          while (response.IsTransientFailure && attempt < MaxAttempts) {
              response = Send(request);
              attempt++;
          }

  - id: F5
    slug: return-early-from-functions
    category: control-flow
    title: Handle the trivial and invalid cases up front and return immediately
    instruction: >
      Deal with empty input, invalid arguments, and other special cases at the
      top of a function and return from each one right away, so everything
      after them handles only the ordinary case and no longer sits inside a
      conditional. The reader then has no accumulated conditions to keep track
      of while reading the part that matters.
    chapter: 7
    severity: warning
    lintable: false
    examples:
      - lang: go
        before: |
          func Total(items []Item) (int, error) {
              if items != nil {
                  if len(items) > 0 {
                      sum := 0
                      for _, it := range items {
                          sum += it.Price
                      }
                      return sum, nil
                  }
                  return 0, nil
              }
              return 0, errors.New("nil items")
          }
        after: |
          func Total(items []Item) (int, error) {
              if items == nil {
                  return 0, errors.New("nil items")
              }
              sum := 0
              for _, it := range items {
                  sum += it.Price
              }
              return sum, nil
          }

  - id: F6
    slug: minimize-nesting
    category: control-flow
    title: Keep nesting shallow, and treat one more level as a signal to restructure
    instruction: >
      Every level of nesting is another condition the reader must hold in mind
      to know whether a line runs at all. Deep nesting is usually residue from
      changes made one at a time, each wrapping working code in one more
      block, so treat the urge to add a level as the moment to reorganize
      instead. Inside a loop, continue past the cases you want to skip; inside
      a function, return early.
    chapter: 7
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: |
          for record in records:
              if record.is_valid:
                  if record.owner is not None:
                      if not record.archived:
                          publish(record)
        after: |
          for record in records:
              if not record.is_valid:
                  continue
              if record.owner is None:
                  continue
              if record.archived:
                  continue
              publish(record)

  - id: F7
    slug: use-flow-obscuring-constructs-sparingly
    category: control-flow
    title: Use constructs that break linear execution order sparingly
    instruction: >
      Threads, signal handlers, callbacks invoked later, exceptions thrown
      across module boundaries, and dynamic dispatch all mean the next line to
      run is not the next line on screen. Each is worth its cost where it
      solves a real problem, and none is worth it as a default shape, because
      every one of them takes away the reader's ability to answer "what
      happens next" by reading downward.
    chapter: 7
    severity: suggestion
    lintable: false

  # --- E: Expressions (chapter 8) ---

  - id: E1
    slug: introduce-an-explaining-variable
    category: expressions
    title: Name a subexpression with a variable that says what it is
    instruction: >
      When part of a larger expression takes a moment to identify, assign it
      to a variable whose name states what it holds, and use that variable in
      the expression. The extra line names the concept once for every future
      reader instead of asking each of them to work it out again.
    chapter: 8
    severity: suggestion
    lintable: false
    examples:
      - lang: typescript
        before: "if (orders[orders.length - 1].placedAt < cutoff) archive(orders);"
        after: |
          const mostRecentOrder = orders[orders.length - 1];
          if (mostRecentOrder.placedAt < cutoff) archive(orders);

  - id: E2
    slug: introduce-a-summary-variable
    category: expressions
    title: Give a recurring condition a short name even when it needs no explanation
    instruction: >
      A compound condition a reader can follow but has to reassemble at every
      appearance is worth naming once as a boolean whose name states the idea.
      Unlike an explaining variable, this is not about clarifying something
      obscure; it is about letting the code talk about the concept instead of
      restating its mechanics each time.
    chapter: 8
    severity: suggestion
    lintable: false
    examples:
      - lang: csharp
        before: |
          if (request.UserId == document.OwnerId || request.Roles.Contains("admin")) { ... }
          // ... elsewhere in the same method ...
          if (request.UserId == document.OwnerId || request.Roles.Contains("admin")) { ... }
        after: |
          bool canEditDocument = request.UserId == document.OwnerId
                                 || request.Roles.Contains("admin");
          if (canEditDocument) { ... }
          // ... elsewhere in the same method ...
          if (canEditDocument) { ... }

  - id: E3
    slug: simplify-negated-compound-conditions
    category: expressions
    title: Rewrite a negated group into whichever equivalent form states the idea more directly
    instruction: >
      A condition that negates a whole group is often clearer with the
      negation distributed across its parts, and sometimes the reverse is
      true. Write both forms and keep the one a reader can evaluate without
      doing algebra first; the goal is directness, not a mechanical
      preference for either shape.
    chapter: 8
    severity: suggestion
    lintable: false
    examples:
      - lang: python
        before: "if not (record.is_synced and record.checksum_matches):"
        after: "if not record.is_synced or not record.checksum_matches:"

  - id: E4
    slug: state-conditions-directly
    category: expressions
    title: State a condition directly instead of comparing it against a boolean or a length
    instruction: >
      Test a boolean by using it, and test a collection for content with the
      language's own idiom for emptiness. Comparing against true, false, or a
      length of zero adds expression for no added meaning, and an equality
      test against a boolean literal invites the classic mistake of writing an
      assignment instead.
    rationale: >
      Original content, with no source in the book: chapter 8 is about cutting
      large expressions down, and says nothing about redundant comparisons.
      It sits in this category because it is an expression-level habit, and it
      is catalogued because it is a frequent tell in generated code.
    chapter: 0
    severity: suggestion
    lintable: false
    exceptions: >
      Make this change only where the two forms are genuinely equivalent.
      Dropping a comparison against a boolean literal is safe for a value
      known to hold a real boolean, but `x == True` and `x` differ for any
      other truthy value. Testing a collection by using it is safe for
      built-in containers, but not for types that redefine truthiness: a
      NumPy array raises on `if x:` where `len(x) > 0` succeeds, and a
      value that might be None needs that case handled on its own terms.
      When the type is not evident from nearby code, leave the comparison
      as it is. This rule is a readability preference, and both `X4` and the
      catalog's first precedence entry put correctness ahead of it.
    examples:
      - lang: python
        before: "if config.verbose == True and len(warnings) > 0:"
        after: "if config.verbose and warnings:"

  - id: E5
    slug: break-down-giant-expressions
    category: expressions
    title: Break a large expression into named steps rather than compressing it into one clever line
    instruction: >
      When an expression outgrows what a reader can hold at once, split it
      into statements with named intermediates, or look for a different
      formulation of the problem that is smaller by construction rather than
      smaller by compression. When an expression resists both, that difficulty
      is usually telling you the problem has been framed awkwardly, not that
      the expression needs more cleverness.
    chapter: 8
    severity: warning
    lintable: false
    examples:
      - lang: javascript
        before: "const fee = order.expedited ? order.total * 0.02 + 15 : order.total * 0.02;"
        after: |
          const handlingFee = order.total * 0.02;
          const expeditingFee = order.expedited ? 15 : 0;
          const fee = handlingFee + expeditingFee;

  - id: E6
    slug: do-not-abuse-short-circuit-logic
    category: expressions
    title: Do not use short-circuit operators to make one line do two jobs
    instruction: >
      Boolean operators are for computing a boolean. Using them to smuggle in
      control flow or a side effect — an assignment hidden inside a condition,
      a call that runs only because it sits to the right of an and — saves a
      line and costs the reader a second pass to work out that the expression
      was never really a question. Write the condition as a condition and the
      action as a statement.
    chapter: 8
    severity: warning
    lintable: false
    examples:
      - lang: javascript
        before: "user && user.isAdmin && grantAccess(user);"
        after: |
          if (user && user.isAdmin) {
            grantAccess(user);
          }
    exceptions: >
      A short-circuit default such as `x = y || fallback` is idiomatic in many
      languages and reads as one idea; this rule targets operators used to run
      code, not to choose a value.

  # --- V: Variables and scope (chapter 9) ---

  - id: V1
    slug: remove-variables-that-add-nothing
    category: variables
    title: Remove a variable that only carries a value from one line to the next
    instruction: >
      A temporary assigned once, used once on the following line, and named no
      better than the expression it holds gives the reader an extra name to
      track in exchange for nothing. Use the expression where it is needed.
      Keep the variable when its name explains something the expression does
      not, or when more than one line uses it.
    chapter: 9
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: |
          def latest_backup(paths):
              result = sorted(paths, key=os.path.getmtime)[-1]
              return result
        after: |
          def latest_backup(paths):
              return sorted(paths, key=os.path.getmtime)[-1]

  - id: V2
    slug: narrow-variable-scope
    category: variables
    title: Narrow each variable's scope to the smallest region that needs it
    instruction: >
      Move a variable inward wherever you can: a global to a class member, a
      member to a local, a local to the block that uses it. The cost of a
      widely scoped variable is not the variable itself but that every line
      within its scope becomes a line the reader must check for a
      modification.
    chapter: 9
    severity: warning
    lintable: false
    examples:
      - lang: java
        before: |
          class ReportBuilder {
              private List<String> sectionLines;   // only ever used inside renderSection

              void renderSection(Section s) {
                  sectionLines = new ArrayList<>();
                  ...
              }
          }
        after: |
          class ReportBuilder {
              void renderSection(Section s) {
                  List<String> sectionLines = new ArrayList<>();
                  ...
              }
          }

  - id: V3
    slug: declare-variables-at-first-use
    category: variables
    title: Declare a variable immediately before its first use
    instruction: >
      Collecting every declaration at the top of a function was once a
      language requirement and is now only a way of separating a name from the
      code that gives it meaning. Declare each variable where it first
      matters, so the reader meets the name and the reason for it at the same
      moment.
    chapter: 9
    severity: suggestion
    lintable: false
    examples:
      - lang: javascript
        before: |
          function renderInvoice(order) {
            let subtotal, tax, dueDate, lineItems;
            lineItems = order.items.map(toLineItem);
            subtotal = lineItems.reduce((sum, li) => sum + li.amount, 0);
            tax = subtotal * TAX_RATE;
            dueDate = addDays(order.placedAt, 30);
            ...
          }
        after: |
          function renderInvoice(order) {
            const lineItems = order.items.map(toLineItem);
            const subtotal = lineItems.reduce((sum, li) => sum + li.amount, 0);
            const tax = subtotal * TAX_RATE;
            const dueDate = addDays(order.placedAt, 30);
            ...
          }

  - id: V4
    slug: prefer-write-once-variables
    category: variables
    title: Prefer values assigned once over variables that change
    instruction: >
      A variable reassigned in several places forces the reader to find every
      assignment before they can say what it holds at a given line. Use the
      language's immutable binding by default, and treat needing reassignment
      as a prompt to check whether the surrounding code wants to be a function
      that returns a value instead.
    chapter: 9
    severity: suggestion
    lintable: false
    examples:
      - lang: typescript
        before: |
          let endpoint = BASE_URL;
          if (useStaging) endpoint = STAGING_URL;
          if (region) endpoint = `${endpoint}/${region}`;
        after: |
          const host = useStaging ? STAGING_URL : BASE_URL;
          const endpoint = region ? `${host}/${region}` : host;

  - id: V5
    slug: replace-control-flow-flags-with-direct-exits
    category: variables
    title: Exit a loop directly instead of steering it with a flag variable
    instruction: >
      A boolean whose only job is telling a loop when to stop duplicates
      control flow the language already expresses, and it delays the exit
      until the next time the condition is checked. Use break or return at the
      point the decision is actually made, so the exit sits where the reader
      is already looking.
    chapter: 9
    severity: suggestion
    lintable: false
    examples:
      - lang: python
        before: |
          found = False
          match = None
          for row in rows:
              if not found and row.id == target:
                  match = row
                  found = True
          return match
        after: |
          for row in rows:
              if row.id == target:
                  return row
          return None

  # --- S: Structure (chapters 10-13) ---

  - id: S1
    slug: extract-unrelated-subproblems
    category: structure
    title: Extract a self-contained subproblem into a function describable without its caller
    instruction: >
      When part of a block solves a problem that is not the block's stated
      purpose — parsing a format, computing a distance, normalizing a key —
      move it into a function whose one-line description mentions nothing
      about where it is called from. Being unable to write that description
      without naming the caller's feature is the sign the split is in the
      wrong place.
    chapter: 10
    severity: warning
    lintable: false
    examples:
      - lang: go
        before: |
          func RenderProfile(u User) string {
              initials := ""
              for _, part := range strings.Fields(u.FullName) {
                  initials += strings.ToUpper(part[:1])
              }
              return fmt.Sprintf("%s (%s)", u.FullName, initials)
          }
        after: |
          func initials(fullName string) string {
              out := ""
              for _, part := range strings.Fields(fullName) {
                  out += strings.ToUpper(part[:1])
              }
              return out
          }

          func RenderProfile(u User) string {
              return fmt.Sprintf("%s (%s)", u.FullName, initials(u.FullName))
          }

  - id: S2
    slug: separate-general-code-and-name-its-home
    category: structure
    title: Keep general-purpose code apart from project logic, and name its home for what it holds
    instruction: >
      Code that would make sense in another project belongs somewhere separate
      from code that only makes sense in this one, so each can be read and
      tested without the other. Name that home for what lives there — retry
      behavior, date arithmetic, currency formatting — because a module called
      utils or helpers records only that nobody decided, and it will go on
      accepting anything.
    chapter: 10
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: |
          # utils.py
          def slugify(text): ...
          def retry_with_backoff(fn): ...
          def format_currency(cents, locale): ...
          def load_customer_tier(customer_id): ...
        after: |
          # text_slugs.py
          def slugify(text): ...

          # retries.py
          def retry_with_backoff(fn): ...

          # money.py
          def format_currency(cents, locale): ...

          # customers.py  (project-specific, not a general utility)
          def load_customer_tier(customer_id): ...

  - id: S3
    slug: do-one-task-at-a-time
    category: structure
    title: Make a block do one task at a time
    instruction: >
      List the separate things a long block actually does, then give each one
      its own function or at least its own paragraph. Work that interleaves
      two tasks — validating while accumulating, parsing while rendering —
      makes the reader track both at once, and neither can be understood or
      changed without disturbing the other.
    chapter: 11
    severity: warning
    lintable: false
    examples:
      - lang: ruby
        before: |
          def import(rows)
            errors = []
            total = 0
            rows.each do |row|
              if row["amount"].nil?
                errors << "missing amount on #{row['id']}"
              else
                total += row["amount"].to_i
              end
            end
            [total, errors]
          end
        after: |
          def validation_errors(rows)
            rows.reject { |row| row["amount"] }
                .map { |row| "missing amount on #{row['id']}" }
          end

          def total_amount(rows)
            rows.filter_map { |row| row["amount"]&.to_i }.sum
          end

  - id: S4
    slug: describe-in-plain-words-then-write-the-code
    category: structure
    title: Describe what the code must do in plain language, then make the code follow that description
    instruction: >
      State the logic in ordinary words, the way you would explain it to a
      colleague, before or while writing it. The description usually comes out
      shorter and better organized than the first code you would have written,
      and when it comes out tangled, that is the design problem surfacing
      while it is still cheap to fix.
    chapter: 12
    severity: suggestion
    lintable: false

  - id: S5
    slug: question-the-requirement-first
    category: structure
    title: Question the requirement before writing code to satisfy it
    instruction: >
      The fastest code to read is code that was never written. Before
      implementing a feature as stated, check whether a narrower version meets
      the actual need, whether an existing path already covers most of it, and
      whether the general case is genuinely required or merely assumed. Code
      that does not exist has no bugs and costs no one any reading time.
    chapter: 13
    severity: suggestion
    lintable: false

  - id: S6
    slug: do-not-abstract-for-a-single-caller
    category: structure
    title: Do not add an abstraction until a second caller needs it
    instruction: >
      A helper, interface, or configuration option introduced for one call
      site adds a layer the reader must step through to find out what actually
      happens, in exchange for flexibility nothing is using. Write it inline,
      and extract it when a second caller arrives and shows what the shared
      shape really is.
    rationale: >
      Chapter 10 warns against over-extraction, but its emphasis runs the
      other way: it argues most human authors do not extract aggressively
      enough. This rule inverts that emphasis deliberately, because the
      failure it guards against is the one generated code actually exhibits.
      Read alongside `S1`, which pushes in the book's direction.
    chapter: 10
    severity: warning
    lintable: false
    examples:
      - lang: typescript
        before: |
          interface Formatter { format(v: number): string; }

          class CurrencyFormatter implements Formatter {
            format(v: number) { return `$${v.toFixed(2)}`; }
          }

          const formatter: Formatter = new CurrencyFormatter();
          row.textContent = formatter.format(total);
        after: "row.textContent = `$${total.toFixed(2)}`;"

  - id: S7
    slug: delete-code-that-cannot-change-the-outcome
    category: structure
    title: Delete code that cannot change the outcome
    instruction: >
      Remove error handling for conditions the surrounding code makes
      impossible, branches no call can reach, options no caller sets,
      functions nothing calls, and code left behind commented out. Such
      code reads as though it guards a real risk or preserves a real
      alternative, so every future reader spends time working out which
      before concluding there is neither. Version control keeps whatever
      you delete.
    chapter: 13
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: |
          def total_cents(prices: list[int]) -> int:
              try:
                  return sum(prices)
              except ZeroDivisionError:
                  return 0
        after: |
          def total_cents(prices: list[int]) -> int:
              return sum(prices)

  - id: S8
    slug: know-and-use-the-standard-library
    category: structure
    title: Know the standard library well enough to reach for it before rewriting it
    instruction: >
      Grouping, counting, deduplicating, pairing sequences, sorting by a key,
      and set arithmetic are already implemented, tested, and named in every
      mainstream standard library. A hand-rolled version is more code to read
      and its bugs belong to you. Periodically reading through the library's
      API is among the cheapest readability investments available.
    chapter: 13
    severity: warning
    lintable: false
    exceptions: >
      A library type is rarely an exact drop-in for the code it replaces, so
      check the difference before making the swap. The example below is
      typical: `Counter` returns zero for a key never seen, where the
      hand-rolled dict raises, so any caller that relies on that raise changes
      behavior. Where the two differ in a way the surrounding code depends on,
      keep the explicit version; correctness comes first (`X4`, and the
      catalog's first precedence entry).
    examples:
      - lang: python
        before: |
          counts = {}
          for tag in tags:
              if tag in counts:
                  counts[tag] += 1
              else:
                  counts[tag] = 1
        after: "counts = Counter(tags)"

  - id: S9
    slug: wrap-awkward-interfaces
    category: structure
    title: Wrap an awkward interface in the one you wish it had
    instruction: >
      When a library or API is cumbersome to call — demanding setup, returning
      a shape you have to convert, taking parameters irrelevant to your use —
      write a small wrapper presenting the interface your code actually wants,
      and call that everywhere. The glue that adapts inputs and outputs is
      rarely part of your program's real logic, and leaving it inline mixes it
      with the logic that is.
    chapter: 10
    severity: suggestion
    lintable: false
    examples:
      - lang: go
        before: |
          // Repeated at every call site that stores an avatar.
          _, err := client.PutObject(ctx, &s3.PutObjectInput{
              Bucket:      aws.String(avatarBucket),
              Key:         aws.String("avatars/" + userID + ".png"),
              Body:        bytes.NewReader(png),
              ContentType: aws.String("image/png"),
              ACL:         types.ObjectCannedACLPrivate,
          })
        after: |
          func storeAvatar(ctx context.Context, userID string, png []byte) error {
              _, err := client.PutObject(ctx, &s3.PutObjectInput{
                  Bucket:      aws.String(avatarBucket),
                  Key:         aws.String("avatars/" + userID + ".png"),
                  Body:        bytes.NewReader(png),
                  ContentType: aws.String("image/png"),
                  ACL:         types.ObjectCannedACLPrivate,
              })
              return err
          }

          // At every call site:
          err := storeAvatar(ctx, userID, png)

  # --- T: Tests and readability (chapter 14) ---

  - id: T1
    slug: make-the-tested-values-visible
    category: tests
    title: Make the values a test is actually about visible at a glance
    instruction: >
      Push construction, fixtures, and repeated setup behind helper functions
      so what remains in the test body is the input under test and the
      expectation about it. A reader should be able to see what is being
      asserted without first reading past scaffolding that is identical in
      every test in the file.
    chapter: 14
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: |
          def test_expired_session_rejected():
              user = User(id=1, name="Ada", email="ada@example.com", verified=True)
              session = Session(user=user, token="abc",
                                created_at=datetime(2020, 1, 1), ttl=3600)
              clock = FrozenClock(datetime(2020, 1, 1, 2, 0, 0))
              assert authorize(session, clock) is False
        after: |
          def test_expired_session_rejected():
              session = a_session(age_seconds=7200, ttl=3600)
              assert authorize(session, FROZEN_NOW) is False

  - id: T2
    slug: choose-the-simplest-revealing-input
    category: tests
    title: Choose the simplest input that still exercises the behavior under test
    instruction: >
      Prefer the smallest, plainest values that trigger the case — a
      two-element list, a single character, a round number — over
      realistic-looking data whose details are irrelevant. Elaborate input
      implies the details matter and sends the reader hunting for a
      significance that is not there. Where an unusual value is the point,
      that is exactly when it should stand out.
    chapter: 14
    severity: suggestion
    lintable: false
    examples:
      - lang: javascript
        before: "expect(median([84.21, 12.09, 55.5, 91.34, 7.02])).toBeCloseTo(55.5);"
        after: "expect(median([1, 2, 3])).toBe(2);"

  - id: T3
    slug: name-tests-for-situation-and-outcome
    category: tests
    title: Name a test for the situation it sets up and the outcome it expects
    instruction: >
      A test name is read most often in a failure report, with none of the
      test's code on screen, so it has to identify the broken behavior on its
      own. Name the unit under test, the condition, and the expected result. A
      name built from a number or a word like basic tells a reader staring at
      a red build nothing at all.
    chapter: 14
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: "def test_parse_2(): ..."
        after: "def test_parse_rejects_timestamp_without_timezone(): ..."

  - id: T4
    slug: make-failures-explain-themselves
    category: tests
    title: Make a failing assertion say what went wrong without a debugger
    instruction: >
      Use the assertion that reports both values rather than one that collapses
      a comparison into a single boolean, and where a comparison is
      domain-specific, write a custom assertion that prints the difference in
      domain terms. What a test prints on failure is its entire interface at
      the only moment anyone reads it.
    chapter: 14
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: "self.assertTrue(actual_total == expected_total)"
        after: "self.assertEqual(actual_total, expected_total)"

  - id: T5
    slug: one-behavior-per-test
    category: tests
    title: Keep each test about one behavior
    instruction: >
      A test asserting several unrelated things stops at the first failure and
      hides the rest, and no name can describe everything it covers. Split it
      so each test has one reason to fail and a name that states that reason.
      Several short tests sharing a setup helper read better than one that
      walks through an entire scenario.
    chapter: 14
    severity: suggestion
    lintable: false
    examples:
      - lang: python
        before: |
          def test_cart():
              cart = Cart()
              cart.add(ITEM, qty=2)
              assert cart.subtotal == 200
              cart.apply_coupon("HALF")
              assert cart.subtotal == 100
              cart.remove(ITEM)
              assert cart.is_empty
        after: |
          def test_subtotal_multiplies_price_by_quantity(): ...
          def test_coupon_reduces_subtotal(): ...
          def test_removing_last_item_empties_cart(): ...

  - id: T6
    slug: treat-untestable-code-as-a-design-signal
    category: tests
    title: Treat hard-to-test code as a design signal, without distorting the design to serve tests
    instruction: >
      Code needing elaborate setup to test usually has real problems — hidden
      global state, too many responsibilities, dependencies it constructs
      instead of receiving — and those are the same problems that make it hard
      to read, so fix them. Stop short of the opposite failure: indirection,
      injection points, and interfaces added only so a test can reach inside
      are a readability cost paid by every reader for the benefit of the test
      suite.
    chapter: 14
    severity: suggestion
    lintable: false
    exceptions: >
      Where a project has an established testing architecture, follow it (`X2`)
      rather than re-litigating its seams inside an unrelated change.

  # --- X: Agent guardrails (original content; no book source) ---

  - id: X1
    slug: do-not-widen-the-diff
    category: guardrails
    title: Do not widen a diff to satisfy a readability rule
    instruction: >
      Change what the task asked you to change. When you notice other code in
      the file that a catalog rule would improve, leave it alone and note it
      in one line of your summary instead. A change that touches thirty lines
      to fix three is harder to review, harder to revert, and buries the part
      that mattered.
    rationale: >
      An agent holding a catalog of readability rules has a standing incentive
      to apply all of them everywhere it looks. Unrequested cleanup is the
      most common way a helpful change becomes an unmergeable one.
    chapter: 0
    severity: error
    lintable: false

  - id: X2
    slug: match-existing-file-conventions
    category: guardrails
    title: Match the file's existing vocabulary and conventions over this catalog's preference
    instruction: >
      Where the surrounding code has already settled a question this catalog
      has an opinion about — a naming shape, an error-handling idiom, a test
      layout — follow what is there. A file that is internally consistent is
      easier to read than one where your additions are individually more
      correct. Raise the difference as a suggestion if it matters; do not
      settle it unilaterally inside a change about something else.
    chapter: 0
    severity: warning
    lintable: false

  - id: X3
    slug: never-rename-public-symbols-unasked
    category: guardrails
    title: Never rename a public or exported symbol unless asked
    instruction: >
      A rename crossing a module or package boundary is a breaking change for
      callers you cannot see, including callers outside the repository. Even
      when the existing name plainly violates a naming rule, propose the
      rename and let a human decide. Names private to the module are fair game
      within the scope of the task.
    chapter: 0
    severity: error
    lintable: false

  - id: X4
    slug: separate-readability-and-behavior-changes
    category: guardrails
    title: Keep readability changes and behavior changes in separate steps
    instruction: >
      Do not fix a bug and restructure the code around it in one edit or one
      commit. A reviewer reading a diff that does both cannot tell which lines
      changed the behavior, and a revert takes back more than intended. Make
      the behavior change and verify it, then clean up separately, or the
      other way around, but never at once.
    chapter: 0
    severity: error
    lintable: false

  - id: X5
    slug: defer-to-the-projects-formatter
    category: guardrails
    title: Leave whitespace, line length, and casing to the project's formatter and linter
    instruction: >
      If the project runs a formatter or a linter, its configuration is the
      answer to every question about spacing, wrapping, quote style, and
      import order, including where this catalog's aesthetics rules would say
      otherwise. Run the tool and accept its output; do not hand-format
      against it, and do not edit its configuration as part of an unrelated
      change.
    chapter: 0
    severity: warning
    lintable: false

  - id: X6
    slug: cite-only-real-rule-ids
    category: guardrails
    title: Cite only rule IDs that exist in this catalog, and report anything else as plain prose
    instruction: >
      Every finding must name an ID that appears in this catalog. When an
      observation is worth reporting but no rule covers it, say it in plain
      words with no ID rather than inventing one that looks plausible. A
      fabricated ID is worse than none: it survives into review threads and
      issue trackers where nobody can look it up.
    rationale: >
      Models reliably invent well-formed identifiers for numbered schemes they
      have been shown. The failure is confident and hard to spot precisely
      because the invented ID matches the real format.
    chapter: 0
    severity: error
    lintable: false

  - id: X7
    slug: do-not-narrate-your-plan-in-comments
    category: guardrails
    title: Do not narrate your own plan or process in code comments
    instruction: >
      Comments describing the steps you are taking — numbered plan entries,
      "first this, then that", notes addressed to whoever requested the change
      — document your process rather than the code, and mean nothing to the
      next reader. Put that narration in your reply and leave the file with
      only the comments a maintainer would want.
    chapter: 0
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: |
          # Step 1: Get the user's records
          records = fetch_records(user_id)
          # Step 2: Now we filter out the archived ones
          active = [r for r in records if not r.archived]
        after: |
          records = fetch_records(user_id)
          active = [r for r in records if not r.archived]

  - id: X8
    slug: no-banners-dividers-or-emoji
    category: guardrails
    title: Do not add banner comments, section dividers, or emoji to code
    instruction: >
      Rows of repeated punctuation, boxed file headers, and emoji in comments,
      log lines, or user-facing strings carry visual weight and no
      information, and almost no codebase adopts them on its own. A file long
      enough to feel like it needs internal signposting is a file that wants
      splitting, not decorating.
    chapter: 0
    severity: warning
    lintable: false
    examples:
      - lang: python
        before: |
          # ============================================================
          # HELPER FUNCTIONS
          # ============================================================
          def normalize(text): ...
        after: "def normalize(text): ..."
    exceptions: >
      A short plain label naming a genuine group of members, as in `A5`, is not
      a banner. The target here is decoration: rules of repeated characters,
      boxed headers, and emoji. Where a project already uses a section-marker
      convention of its own, follow it (`X2`).

# The catalog's own tiebreakers, in order. These resolve conflicts between the
# rules above; `P1` is the principle the last of them appeals to.
precedence:
  - Correctness beats readability. A clearer version that changes behavior is not an improvement.
  - Project convention beats catalog preference.
  - Reader comprehension time beats brevity, cleverness, and rule-count compliance.
  - The project's formatter and linter configuration wins every whitespace argument.
  - When two catalog rules conflict, prefer the one that reduces time-to-understand for a reader unfamiliar with the code.
