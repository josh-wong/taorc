name: Release

# v1-design-doc.md §9: on a version tag, validate, build the skill .zip for
# claude.ai upload, take the release notes from CHANGELOG.md, and publish.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # VERSION is the single source for every version field, so a tag that
      # disagrees with it would publish a release whose manifests and managed
      # blocks advertise a different version from its own name.
      - name: Fail if the tag does not match VERSION
        run: |
          version="$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})." >&2
            exit 1
          fi

      - name: Fail if generated adapters drifted from the committed source
        run: |
          python scripts/build.py
          git diff --exit-code

      - name: Run the CI validation gate
        run: python scripts/validate.py

      # The archive holds a top-level readable-code/ directory, which is the
      # shape claude.ai's skill upload expects (§6.3).
      - name: Build the skill archive
        run: |
          archive="taorc-skill-${GITHUB_REF_NAME}.zip"
          (cd skills && zip -r "../${archive}" readable-code -x '*/__pycache__/*' '*.pyc' '*/.DS_Store')
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      # Everything between this version's "## [X.Y.Z]" heading and the next
      # "## [" heading. An empty result means CHANGELOG.md has no entry for
      # this version, which should stop the release rather than ship blank
      # notes.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no entry for ${version}." >&2
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
