name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build generated adapters
        run: python scripts/build.py

      - name: Fail if generated adapters drifted from the committed source
        run: git diff --exit-code

      - name: Run the CI validation gate
        run: python scripts/validate.py
