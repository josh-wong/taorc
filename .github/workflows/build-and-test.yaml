name: Build and test

on:
  # Pull requests only; lint.yaml carries the full note, including the three
  # gaps this leaves. One of them lands harder here than there: two PRs that
  # are each green alone can still break main together, because build.py
  # derives every adapter from inputs that separate PRs touch independently --
  # one editing catalog/rules.yaml, another templates/agent-block.md or
  # VERSION. The drift check below is exactly what catches that, and with no
  # push trigger it does not run on the merge result. Until branch protection
  # is available, the mitigation is procedural: merge one PR at a time, and
  # re-run this against the new main before merging the next.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build generated adapters
        run: python scripts/build.py

      - name: Fail if generated adapters drifted from the committed source
        run: git diff --exit-code

      - name: Run the CI validation gate
        run: python scripts/validate.py

      # Named one by one rather than discovered: evals/tests has no
      # __init__.py, so `unittest discover` from the repo root fails with
      # "Start directory is not importable". A new test file must be added
      # here or it never runs.
      - name: Run the eval scoring tests
        run: python evals/tests/test_score.py -v

      - name: Run the eval judging tests
        run: python evals/tests/test_judge.py -v

      # R7.4: a scoring-logic change must regenerate every published artifact
      # it affects. Re-score each committed run and fail on any drift, so a
      # future change to score.py cannot silently orphan scores.json. A run
      # scored under an earlier SCORER_VERSION is exempt: score.py returns
      # without rewriting it (its numbers were published under a different
      # metric definition), so git diff stays clean for it while every
      # current-version run is still checked.
      - name: Fail if re-scoring a published run drifts from its committed scores.json
        run: |
          for run in evals/results/*/; do
            [ -d "${run}raw" ] && [ -f "${run}scores.json" ] || continue
            python evals/score.py --run "$run"
          done
          git diff --exit-code -- 'evals/results/*/scores.json'

  # §9 items 8-9: installer behavior and placement-matrix tests need to pass
  # on all three OSes, since install.sh and install.ps1 each have to work
  # standalone -- a Linux-only pass would never catch a bash-ism install.ps1
  # doesn't share, or vice versa. A separate job from build-and-test above so
  # a placement-matrix failure on one OS doesn't block the (cheaper, faster)
  # drift and validation checks from reporting on the other two.
  installer-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run installer and placement-matrix tests
        run: python scripts/tests/test_installer.py -v
