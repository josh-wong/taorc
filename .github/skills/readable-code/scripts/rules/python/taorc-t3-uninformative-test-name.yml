id: taorc-t3-uninformative-test-name-python
language: Python
severity: warning
message: "[T3] Uninformative test name"
note: name the test for the situation it sets up and the outcome it expects
rule:
  kind: identifier
  regex: '^test_?(\d+|it|works|basic|main|case\d*)?$'
  inside:
    kind: function_definition
    field: name
