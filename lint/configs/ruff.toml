# Recommended ruff configuration for the structural checks taorc-lint does
# not implement (v1-design-doc.md §8.1's deliberate non-goal): nesting depth,
# function length, and boolean/branch complexity. taorc-lint covers the nine
# high-precision rules in catalog/rules.yaml; a mainstream linter already
# does structural checks well, and reimplementing them would violate S8 in
# our own repo.
#
# This file is documentation, not an installed dependency -- copy the
# [lint] section below into your project's own ruff.toml (or merge the
# `select` codes into an existing one) and adjust the thresholds to taste.
# No agent following the readable-code skill runs or installs ruff itself.

[lint]
select = [
  "C901",   # mccabe: cyclomatic complexity
  "PLR0912", # pylint: too many branches
  "PLR0913", # pylint: too many arguments
  "PLR0915", # pylint: too many statements
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-branches = 12
max-args = 5
max-statements = 50
